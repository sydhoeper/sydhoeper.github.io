<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2.75in" height="2.75in" viewBox="0 0 825 825" role="img" aria-labelledby="title description">
  <title id="title">Syd Hoeper business card front</title>
  <desc id="description">Cream square business card with Syd Hoeper’s name, title, cosmic squid mark, and a soft pastel rainbow ribbon.</desc>
  <defs>
    <linearGradient id="pastel-rainbow-front" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F2A8C4"/>
      <stop offset="0.2" stop-color="#F7BD91"/>
      <stop offset="0.4" stop-color="#F3DC87"/>
      <stop offset="0.6" stop-color="#9FD7BE"/>
      <stop offset="0.8" stop-color="#9BC7EA"/>
      <stop offset="1" stop-color="#C2AFE8"/>
    </linearGradient>
    <filter id="front-glow" x="-45%" y="-30%" width="190%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="front-softness" x="-35%" y="-20%" width="170%" height="140%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&amp;display=swap");
      .display { font-family: "Fraunces", Georgia, serif; font-weight: 700; }
      .sans { font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="825" height="825" fill="#FFF9F0"/>

  <path d="M 525 -115 C 805 35 770 205 570 302 C 335 415 80 350 116 544 C 148 716 560 652 757 917"
        fill="none" stroke="url(#pastel-rainbow-front)" stroke-width="158" stroke-linecap="round" opacity="0.18" filter="url(#front-glow)"/>
  <path d="M 525 -115 C 805 35 770 205 570 302 C 335 415 80 350 116 544 C 148 716 560 652 757 917"
        fill="none" stroke="url(#pastel-rainbow-front)" stroke-width="92" stroke-linecap="round" opacity="0.3" filter="url(#front-softness)"/>

  <image x="690" y="82" width="48" height="48" xlink:href="data:image/png;base64," href="data:image/png;base64,"/>

  <text class="sans" x="88" y="118" fill="#6F6677" font-size="23" font-weight="650" letter-spacing="3.8">SENIOR PRODUCT DESIGNER</text>
  <text class="display" x="82" y="310" fill="#1C1220" font-size="106" letter-spacing="-5">Syd</text>
  <text class="display" x="82" y="414" fill="#1C1220" font-size="106" letter-spacing="-5">Hoeper</text>

  <line x1="88" y1="473" x2="319" y2="473" stroke="#1C1220" stroke-width="3"/>
  <text class="sans" x="88" y="531" fill="#1C1220" font-size="26" font-weight="600">Digital products, systems</text>
  <text class="sans" x="88" y="570" fill="#1C1220" font-size="26" font-weight="600">&amp; interactive media</text>
  <text class="sans" x="88" y="699" fill="#6F6677" font-size="23" font-weight="600" letter-spacing="0.8">they / them</text>
</svg>
