<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syd Hoeper · Business Card Proof</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 3rem;
      background: #e9e5df;
      color: #1c1220;
      font-family: "Avenir Next", Avenir, Arial, sans-serif;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p { margin: 0 0 2rem; color: #6f6677; }
    main { display: flex; flex-wrap: wrap; gap: 3rem; }
    figure { margin: 0; }
    figcaption { margin-bottom: 0.65rem; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    img { display: block; width: min(420px, calc(100vw - 6rem)); height: auto; box-shadow: 0 14px 36px rgb(28 18 32 / 18%); }
    @media (max-width: 620px) { body { padding: 1.5rem; } img { width: calc(100vw - 3rem); } }
  </style>
</head>
<body>
  <h1>Square business card proof</h1>
  <p>Artwork includes 0.125-inch bleed. The finished card trims to 2.5 × 2.5 inches.</p>
  <main>
    <figure>
      <figcaption>Front</figcaption>
      <img src="business-card-front.svg" alt="Front of Syd Hoeper’s square business card">
    </figure>
    <figure>
      <figcaption>Back</figcaption>
      <img src="business-card-back.svg" alt="Back of Syd Hoeper’s square business card">
    </figure>
  </main>
</body>
</html>
