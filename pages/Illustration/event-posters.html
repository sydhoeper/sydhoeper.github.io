<article class="art-gallery-page" data-gallery-page>
  <h1>Event Posters</h1>

  <div class="art-grid" data-gallery>
    <button class="art-gallery-item" type="button" data-gallery-item aria-label="Open event poster 1 full screen"><img src="/images/Digitial%20Portraits/Posters/web/IMG_1873.jpg" alt="Event poster designed by Syd Hoeper" loading="eager" decoding="async"></button>
    <button class="art-gallery-item" type="button" data-gallery-item aria-label="Open event poster 2 full screen"><img src="/images/Digitial%20Portraits/Posters/web/IMG_1874.jpg" alt="Event poster designed by Syd Hoeper" loading="lazy" decoding="async"></button>
    <button class="art-gallery-item" type="button" data-gallery-item aria-label="Open event poster 3 full screen"><img src="/images/Digitial%20Portraits/Posters/web/IMG_2364.jpg" alt="Event poster designed by Syd Hoeper" loading="lazy" decoding="async"></button>
    <button class="art-gallery-item" type="button" data-gallery-item aria-label="Open event poster 4 full screen"><img src="/images/Digitial%20Portraits/Posters/web/IMG_2394.jpg" alt="Event poster designed by Syd Hoeper" loading="lazy" decoding="async"></button>
    <button class="art-gallery-item" type="button" data-gallery-item aria-label="Open event poster 5 full screen"><img src="/images/Digitial%20Portraits/Posters/web/IMG_2494.jpg" alt="Event poster designed by Syd Hoeper" loading="lazy" decoding="async"></button>
    <button class="art-gallery-item" type="button" data-gallery-item data-gallery-type="video" data-full="/images/Digitial%20Portraits/Posters/web/fa31eaa8398f40a4b54f6c9f7ab93907.mp4" aria-label="Open animated event poster full screen"><img src="/images/Digitial%20Portraits/Posters/web/fa31eaa8398f40a4b54f6c9f7ab93907-poster.png" alt="Animated event poster designed by Syd Hoeper" loading="lazy" decoding="async"></button>
  </div>

  <dialog class="gallery-lightbox" data-gallery-dialog aria-label="Event posters viewer">
    <button class="gallery-lightbox-close" type="button" data-gallery-close aria-label="Close full-screen image">&times;</button>
    <button class="gallery-lightbox-nav" type="button" data-gallery-previous aria-label="Previous image">&#8592;</button>
    <figure><img data-gallery-image alt=""><video data-gallery-video controls playsinline aria-label="Animated event poster" hidden></video><figcaption data-gallery-counter aria-live="polite"></figcaption></figure>
    <button class="gallery-lightbox-nav" type="button" data-gallery-next aria-label="Next image">&#8594;</button>
  </dialog>
</article>
