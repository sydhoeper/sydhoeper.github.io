<style>
    .marker-gallery-page h1 {
        margin-bottom: 2rem;
    }

    .marker-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 0.75rem;
    }

    .marker-gallery-item {
        aspect-ratio: 1;
        padding: 0;
        overflow: hidden;
        border: 0;
        background: #e8e3dc;
        cursor: zoom-in;
    }

    .marker-gallery-item img {
        display: block;
        width: 100%;
        height: 100%;
        max-width: none;
        margin: 0;
        object-fit: cover;
        transition: transform 180ms ease;
    }

    .marker-gallery-item:hover img {
        transform: scale(1.03);
    }

    .marker-gallery-item:focus-visible {
        outline: 3px solid var(--color-text);
        outline-offset: 3px;
    }

    .marker-lightbox {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 1.5rem;
        border: 0;
        background: rgba(20, 20, 28, 0.96);
        color: white;
    }

    .marker-lightbox[open] {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr) 64px;
        align-items: center;
    }

    .marker-lightbox::backdrop {
        background: rgba(20, 20, 28, 0.96);
    }

    .marker-lightbox figure {
        display: grid;
        min-width: 0;
        height: 100%;
        margin: 0;
        place-items: center;
    }

    .marker-lightbox img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: calc(100dvh - 5rem);
        margin: 0;
        object-fit: contain;
    }

    .marker-lightbox figcaption {
        position: fixed;
        right: 1.5rem;
        bottom: 1rem;
        left: 1.5rem;
        text-align: center;
    }

    .marker-lightbox button {
        border: 0;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        cursor: pointer;
    }

    .marker-lightbox button:hover,
    .marker-lightbox button:focus-visible {
        background: rgba(255, 255, 255, 0.24);
    }

    .marker-lightbox-nav {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        font-size: 1.75rem;
        line-height: 1;
    }

    .marker-lightbox-close {
        position: fixed;
        z-index: 1;
        top: 1rem;
        right: 1rem;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        font-size: 2rem;
        line-height: 1;
    }

    body:has(.marker-lightbox[open]) {
        overflow: hidden;
    }

    @media (max-width: 600px) {
        .marker-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .marker-lightbox {
            padding: 1rem 0.5rem;
        }

        .marker-lightbox[open] {
            grid-template-columns: 48px minmax(0, 1fr) 48px;
        }

        .marker-lightbox-nav {
            width: 42px;
            height: 42px;
        }
    }
</style>
