<style>
    .linocuts-page {
        width: 100%;
        max-width: 1120px;
    }

    .linocuts-intro {
        padding-bottom: clamp(var(--space-7), 7vw, var(--space-9));
    }

    .linocuts-intro h1 {
        max-width: 12ch;
        margin: 0 0 var(--space-5);
        font-family: var(--font-display);
        font-size: var(--type-hero-size);
        line-height: var(--type-hero-line-height);
        letter-spacing: var(--type-hero-spacing);
        text-wrap: balance;
    }

    .linocuts-intro > p {
        max-width: 58ch;
        margin: 0;
        font-size: var(--type-lede-size);
        line-height: var(--type-lede-line-height);
    }

    .linocuts-gallery-section {
        padding: clamp(var(--space-7), 7vw, var(--space-9)) 0;
        border-top: var(--border-subtle);
    }

    .linocuts-gallery-heading {
        display: grid;
        grid-template-columns: minmax(190px, 0.4fr) minmax(0, 1fr);
        gap: clamp(var(--space-6), 6vw, 5rem);
        align-items: start;
        margin-bottom: clamp(var(--space-6), 5vw, var(--space-8));
    }

    .linocuts-gallery-heading h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: var(--type-section-heading-size);
        line-height: var(--type-section-heading-line-height);
        letter-spacing: var(--type-section-heading-spacing);
    }

    .linocuts-gallery-heading p {
        max-width: 52ch;
        margin: 0;
        font-size: var(--type-section-copy-size);
        line-height: var(--type-section-copy-line-height);
    }

    .linocuts-grid {
        grid-template-columns: repeat(12, minmax(0, 1fr));
    }

    .linocuts-grid .art-gallery-item {
        height: auto;
        background: var(--color-media-canvas);
    }

    .linocuts-grid .art-gallery-item img {
        height: 100%;
        object-fit: contain;
        transition: transform 180ms ease;
    }

    .linocut-rings,
    .linocut-lava {
        grid-column: span 5;
    }

    .linocut-motorcycle,
    .linocut-squid {
        grid-column: span 7;
    }

    .linocut-banana {
        grid-column: span 4;
    }

    .linocut-eye {
        grid-column: span 8;
    }

    .linocut-rings {
        aspect-ratio: 2146 / 2200;
    }

    .linocut-motorcycle {
        aspect-ratio: 1420 / 1190;
    }

    .linocut-banana {
        aspect-ratio: 744 / 998;
    }

    .linocut-eye {
        aspect-ratio: 1952 / 1522;
    }

    .linocut-lava {
        aspect-ratio: 2282 / 3179;
    }

    .linocut-squid {
        aspect-ratio: 2420 / 2474;
    }

    .linocuts-grid .art-gallery-item:hover img {
        transform: scale(1.03);
    }

    @media (max-width: 820px) {
        .linocut-rings,
        .linocut-motorcycle,
        .linocut-banana,
        .linocut-eye,
        .linocut-lava,
        .linocut-squid {
            grid-column: span 6;
        }
    }

    @media (max-width: 600px) {
        .linocuts-gallery-heading,
        .linocuts-grid {
            grid-template-columns: 1fr;
        }

        .linocut-rings,
        .linocut-motorcycle,
        .linocut-banana,
        .linocut-eye,
        .linocut-lava,
        .linocut-squid {
            grid-column: 1;
        }
    }
</style>

<article class="linocuts-page" data-gallery-page data-gallery>
    <header class="linocuts-intro">
        <span class="project-eyebrow">Ongoing studio practice</span>
        <h1>Linocuts</h1>
        <p>Hand-carved and hand-printed works built from layered color, bold shapes, and the texture left behind by the carving process.</p>
    </header>

    <section class="linocuts-gallery-section" aria-labelledby="linocuts-gallery-heading">
        <div class="linocuts-gallery-heading">
            <h2 id="linocuts-gallery-heading">Selected prints</h2>
            <p>A collection spanning landscapes, cosmic imagery, and strange little objects. Select any print to see a larger view.</p>
        </div>

        <div class="art-grid linocuts-grid">
            <button class="art-gallery-item linocut-rings" type="button" data-gallery-item>
                <img src="/images/Linocuts/interconnected-rings.jpg" width="2146" height="2200" alt="Pastel blue, green, and lavender linocut of overlapping circular forms" loading="eager" decoding="async">
            </button>
            <button class="art-gallery-item linocut-motorcycle" type="button" data-gallery-item>
                <img src="/images/Linocuts/motorcycle-ride-gallery.png" width="1420" height="1190" alt="Layered linocut of a motorcycle ride through a yellow cornfield" loading="eager" decoding="async">
            </button>
            <button class="art-gallery-item linocut-banana" type="button" data-gallery-item>
                <img src="/images/Linocuts/after-dinah-gallery.png" width="744" height="998" alt="Yellow and brown linocut of a banana against a repeating square pattern" loading="lazy" decoding="async">
            </button>
            <button class="art-gallery-item linocut-eye" type="button" data-gallery-item>
                <img src="/images/Linocuts/loving-eye-of-god-gallery.png" width="1952" height="1522" alt="Black, white, purple, and blue linocut of an eye filled with stars" loading="lazy" decoding="async">
            </button>
            <button class="art-gallery-item linocut-lava" type="button" data-gallery-item>
                <img src="/images/Linocuts/lava-lamp.jpg" width="2282" height="3179" alt="Burgundy, pink, and red linocut of a glowing lava lamp" loading="lazy" decoding="async">
            </button>
            <button class="art-gallery-item linocut-squid" type="button" data-gallery-item>
                <img src="/images/Linocuts/cosmic-squid.jpg" width="2420" height="2474" alt="Black and white linocut of a one-eyed squid surrounded by moon phases and stars" loading="lazy" decoding="async">
            </button>
        </div>
    </section>

    <dialog class="gallery-lightbox" data-gallery-dialog aria-label="Linocuts viewer">
        <button class="gallery-lightbox-close" type="button" data-gallery-close aria-label="Close full-screen image">&times;</button>
        <button class="gallery-lightbox-nav" type="button" data-gallery-previous aria-label="Previous image">&#8592;</button>

        <figure>
            <img data-gallery-image src="" alt="">
            <figcaption data-gallery-counter aria-live="polite"></figcaption>
        </figure>

        <button class="gallery-lightbox-nav" type="button" data-gallery-next aria-label="Next image">&#8594;</button>
    </dialog>
</article>
